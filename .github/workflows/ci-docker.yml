# CI & Docker Build: runs on every PR to staging/main, manually, and (workflow_call) before a deploy.
# Deploy-script offline tests -> migrate + seed -> server tests -> typecheck -> build -> Docker build. Deploys nothing.
# Keep the job id `test-and-docker` (the lab guide and branch protection refer to it).
name: CI & Docker Build

on:
  workflow_call:
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Throw-away test database (CI values, not secrets). Test code only accepts a *_test database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: cpms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/cpms_test
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/cpms_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Deploy scripts (offline, no GCP)
        run: |
          bash -n deploy/deploy.sh deploy/teardown.sh deploy/release.sh
          bash deploy/tests/test_deploy_stub.sh
          bash deploy/tests/test_release_stub.sh
          python3 -m unittest discover -s deploy/tests -p 'test_smoke.py'

      - run: npm ci

      - name: Prisma generate + migrate + seed
        working-directory: server
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed

      - name: Server tests (Vitest)
        run: npm test

      - run: npm run typecheck

      - name: Build server + web
        run: npm run build

      - name: Docker build (not pushed)
        run: docker build -t cpms:ci .
