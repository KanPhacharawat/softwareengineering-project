# Local PostgreSQL 16 for development and tests.
# Start: npm run db:up   Stop: npm run db:down   Wipe data: docker compose down -v
# Creates cpms_dev (dev) and cpms_test (used by `npm test`), user app / password app.
# Host port 5433 so it does not clash with a PostgreSQL already installed on 5432.
services:
  db:
    image: postgres:16-alpine
    container_name: cpms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: cpms_dev
    ports:
      - "5433:5432"
    volumes:
      - cpms-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d cpms_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  cpms-db-data:
